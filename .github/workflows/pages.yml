name: Deploy Pages

# DaveHomeAssist/system-by-dave pushes this site's files here after its release
# gates pass (scripts/publish_domain_site.sh). Edit the source there.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions pinned by SHA, matching system-by-dave's Pages workflow.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage site
        id: stage
        run: |
          if [ ! -f source.json ]; then
            echo "Nothing published yet; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='README.md' --exclude='_site' ./ _site/
          echo "Staged $(find _site -type f | wc -l) files from $(python3 -c 'import json; print(json.load(open("source.json"))["sourceCommit"][:12])')."
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        if: steps.stage.outputs.ready == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        if: steps.stage.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.stage.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
